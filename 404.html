<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found — nekomimi0128.com</title>
<meta name="description" content="お探しのページは見つかりませんでした。">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐈</text></svg>">
<style>
  :root {
    --bg: #070a12;
    --panel: #0d1420;
    --line: #243145;
    --text: #eef2f7;
    --sub: #93a3b5;
    --accent: #5ec4e6;
    --accent2: #e6c87a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    line-height: 1.75;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  #stars { position: fixed; inset: 0; z-index: -1; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .panel {
    max-width: 560px;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2.6rem 1.8rem;
    text-align: center;
  }
  .code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(4rem, 18vw, 6.5rem);
    line-height: 1;
    margin: 0;
    letter-spacing: .05em;
  }
  .en {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--sub);
    letter-spacing: .35em;
    font-size: .8rem;
    margin: .7rem 0 0;
  }
  h1 { font-size: 1.35rem; margin: 1.4rem 0 .5rem; }
  p { margin: .5rem 0; }
  .sub { color: var(--sub); font-size: .93rem; }
  .teapot {
    margin-top: 1.6rem;
    padding-top: 1.2rem;
    border-top: 1px dashed var(--line);
    color: var(--sub);
    font-size: .9rem;
  }
  .teapot .pot { font-size: 1.6rem; }
  .teapot .tcode {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--accent2);
    letter-spacing: .2em;
    font-size: .78rem;
  }
  .links {
    margin-top: 1.8rem;
    display: flex;
    gap: .8rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .links a {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: .5rem 1.4rem;
    color: var(--text);
    font-size: .95rem;
  }
  .links a:hover { border-color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<main class="panel">
  <p class="code">404</p>
  <p class="en">NOT FOUND</p>
  <h1>ページが見つかりません</h1>
  <p class="sub">お探しのページは存在しないか、移動した可能性があります。<br>URLをご確認のうえ、もう一度お試しください。</p>

  <div class="teapot">
    <div class="pot">🫖</div>
    <div class="tcode">HTTP 418</div>
    <p>ついでに言っておくと、このサーバーはティーポットなので、<br>コーヒーも淹れられません。</p>
  </div>

  <div class="links">
    <a href="/">トップページへ</a>
    <a href="/radio/">RADIO ページへ</a>
  </div>
</main>

<script>
  // 星空（トップページと同じ仕組み）
  const cv = document.getElementById("stars"), cx = cv.getContext("2d");
  let stars = [];
  function buildStars() {
    cv.width = innerWidth; cv.height = innerHeight;
    stars = Array.from({ length: 150 }, () => ({
      x: Math.random() * cv.width, y: Math.random() * cv.height,
      r: Math.random() * 1.3 + .2, p: Math.random() * Math.PI * 2, s: .008 + Math.random() * .02
    }));
  }
  function drawStars() {
    cx.clearRect(0, 0, cv.width, cv.height);
    for (const st of stars) {
      st.p += st.s;
      cx.globalAlpha = .35 + Math.sin(st.p) * .3;
      cx.fillStyle = "#cfe4ff";
      cx.beginPath(); cx.arc(st.x, st.y, st.r, 0, Math.PI * 2); cx.fill();
    }
    cx.globalAlpha = 1;
    requestAnimationFrame(drawStars);
  }
  addEventListener("resize", buildStars);
  buildStars(); drawStars();
</script>

</body>
</html>
